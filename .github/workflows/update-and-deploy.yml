name: Refresh convention feed and deploy

"on":
  push:
    branches:
      - main

  schedule:
    - cron: "17 7,15,23 * * *"

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: convention-feed-pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Refresh public convention data
        run: node scripts/update-events.mjs

      - name: Save refreshed convention data
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .last-refresh
          git config user.name "convention-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json .last-refresh
          if ! git diff --cached --quiet; then
            git commit -m "Refresh convention calendar"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
